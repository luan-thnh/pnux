name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Portlane
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Linux CLI tests
        run: npm test
      - name: Check npm package contents (no publish)
        run: npm run pack:check
      - name: Check landing page JavaScript
        run: node --check site/app.js
      - name: Check static site assets
        run: |
          test -s site/index.html
          test -s site/style.css
          test -s site/app.js
          test -s site/mark.svg

  deploy:
    name: Deploy landing page
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
